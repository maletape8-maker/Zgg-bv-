      - name: Generer chrono_html.h
        run: |
          python3 -c "import json;h=open('chrono.html',encoding='utf-8').read().replace('__RANK_B64__',''.join(open('rank.b64').read().split()));open('chrono_html.h','w',encoding='utf-8').write('static const char *CHRONO_HTML = '+json.dumps(h,ensure_ascii=False)+';')"
      - name: Recuperer fishhook
        run: |
          for b in main master; do
            curl -fsSL -o fishhook.c "https://raw.githubusercontent.com/facebook/fishhook/$b/fishhook.c" && curl -fsSL -o fishhook.h "https://raw.githubusercontent.com/facebook/fishhook/$b/fishhook.h" && break
          done
          test -s fishhook.c && test -s fishhook.h
      - name: Compiler le dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
