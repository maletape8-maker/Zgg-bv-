          <div id="pop"></div>
          <script>
          const $=i=>document.getElementById(i),p2=n=>String(n).padStart(2,'0'),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
          /* image du classement : fichier classement.png (ou jpg, jpeg, webp) à la racine du dépôt GitHub */
          const RANK='https://raw.githubusercontent.com/${{ github.repository }}/main/classement.';
          const RANKFB='data:image/jpeg;base64,__RANK_B64__';
          const S={mode:'livesplit',op:100,size:60,bg:'#000000',lab:0,gl:0,x:40,y:100,
          txt:'By SG',txOn:0,glue:1,ox:60,oy:220,tsz:48,tdo:100,tcol:'#ffffff',tfx:'none',tan:'none',tsp:50,tb:0,tbg:'none',tbc:'#000000',tbo:75,tsk:0,tskc:'#000000',
          str:0,sp:100,res:'1440x1080',rx:1440,ry:1080,gray:0,spm:'1',spc:'1.5',
          idia:0,itn:0,fps:1,ith:1,ilive:1,icol:'#ffffff',ibg:'#000000',isz:100,ian:'roll',ifont:'serif',
          theme:'auto',dockOn:1,dock:'',dsz:100,dop:100,dtc:'#ffffff',dbgOn:1,dbg:'#000000',dba:35,dcs:1,dimg:0,dio:100,dis:100,dix:50,diy:50,limg:0,lio:100,lis:100,lix:50,liy:50,lba:100,iimg:0,iio:100,iis:100,iix:50,iiy:50,ibgOn:1,
          lop:100,lsz:100,lw:252,lh:50,lbg:'#000000',lbgOn:0,acc:'.23',dec:35,grad:1,sh:1,run:'#29cc54',idle:'#7a7a7a',pau:'#16a6ff'};
          try{Object.assign(S,JSON.parse(localStorage.getItem('bysgSettings2')||'{}'))}catch(e){}
          if(S.mode==='text'){S.mode='none';S.txOn=1}
          let sT=0;const save=()=>{clearTimeout(sT);sT=setTimeout(()=>{try{localStorage.setItem('bysgSettings2',JSON.stringify(S))}catch(e){}},250)};
          let BG='';try{BG=localStorage.getItem('bysgBg')||''}catch(e){}
          if(BG&&S.limg===0&&!('limgMig' in S)){S.limgMig=1;S.limg=1;if(!S.lbgOn){S.lbgOn=1;S.lba=0}}
