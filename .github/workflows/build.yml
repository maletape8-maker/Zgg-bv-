          }
          /* sélecteur de couleur (carré saturation/luminosité + teinte) */
          function h2x(h,s,v){const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1)))).toString(16).padStart(2,'0')};return'#'+f(5)+f(3)+f(1)}
          function x2h(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,m=Math.max(r,g,b),d=m-Math.min(r,g,b);let h=0;if(d){h=m===r?(g-b)/d+(g<b?6:0):m===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,m?d/m:0,m]}
          function initCp(){pop.querySelectorAll('.cp').forEach(p=>{
            const k=p.dataset.k,sw=p.querySelector('.cs'),sv=p.querySelector('.sv'),dot=sv.firstChild,hu=p.querySelector('.hu');
            let[H,Sa,V]=x2h(S[k]);if(!Sa)H=0;hu.value=H;
