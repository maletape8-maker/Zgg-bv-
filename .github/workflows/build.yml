          function tick(){if(st==='running'){el=performance.now()-t0;render();raf=requestAnimationFrame(tick)}}
          function toggle(){
            if(st==='running'){cancelAnimationFrame(raf);el=performance.now()-t0;st='paused'}
            else{t0=performance.now()-el;st='running';raf=requestAnimationFrame(tick)}
            paint();render();
          }
          function reset(){cancelAnimationFrame(raf);el=0;st='stopped';paint();render()}
          /* résolution choisie (clamp) et vitesse effective */
          function resv(){let a,b;if(S.res==='custom'){a=+S.rx;b=+S.ry}else{[a,b]=String(S.res).split('x').map(Number)}return[Math.min(8000,Math.max(200,a||1440)),Math.min(8000,Math.max(200,b||1080))]}
          function spdv(){return 1}
          function inf(){const e=$('si');if(!e)return;const d=window.NS||window.devicePixelRatio||1,a=Math.round(Math.max(innerWidth,innerHeight)*d),b=Math.round(Math.max(1,Math.min(innerWidth,innerHeight))*d),r=resv(),L=Math.max(r[0],r[1]),H=Math.min(r[0],r[1]),k=Math.min(1,a/L,b/H);e.textContent=t('si1')+' '+a+'×'+b+' · '+t('si2')+' '+Math.round(L*k)+'×'+Math.round(H*k)+(k<1?' · '+t('si3'):'')}
          function hexa(h,a){return'rgba('+parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)+','+a+')'}
          function apply(){thm();$('fps').style.display=S.fps?'block':'none';
            if(S.mode==='none'&&!S.txOn)S.txOn=1;
            const c=S.mode==='chrono',tx=$('tx'),tw=$('tw'),par=S.glue?w:tw;
            if(tx.parentNode!==par)par.appendChild(tx);
            const dkd=dockOn();w.style.left=(dkd?(S.dock==='l'?-(w.offsetWidth*K)-4:innerWidth+4):S.x)+'px';w.style.top=S.y+'px';w.style.opacity=1;$('chrono').style.opacity=S.op/100;$('ls').style.opacity=S.lop/100;tx.style.opacity=S.tdo/100;
            w.style.transform='scale('+(K=c?S.size/85:S.mode==='livesplit'?S.lsz/100:S.mode==='ios'?S.isz/100:S.mode==='dk'?S.dsz/100:1)+')';
          BYSG_HTML_END
      - name: Ecrire chrono.html (3/5)
        run: |
          cat >> chrono.html <<'BYSG_HTML_END'
            if(dkd)w.style.left=(S.dock==='l'?-(w.offsetWidth*K)-4:innerWidth+4)+'px';$('ios').style.display=S.mode==='ios'?'block':'none';$('dk').style.display=S.mode==='dk'?'flex':'none';$('dk').style.opacity=S.dop/100;$('chrono').style.display=c?'flex':'none';$('ls').style.display=S.mode==='livesplit'?'flex':'none';tx.style.display=S.txOn?'block':'none';
            tw.style.display=(!S.glue&&S.txOn)?'block':'none';tw.style.left=S.ox+'px';tw.style.top=S.oy+'px';
            const rr=parseInt(S.bg.slice(1,3),16),gg=parseInt(S.bg.slice(3,5),16),bb=parseInt(S.bg.slice(5,7),16),light=(.2126*rr+.7152*gg+.0722*bb)/255>.5;
            document.querySelectorAll('.tb').forEach(b=>{
              b.classList.toggle('lb',!!S.lab);const x=b.style;
              if(S.gl){x.background='rgba(255,255,255,.08)';x.backdropFilter=x.webkitBackdropFilter='blur(16px)';x.border='1px solid rgba(255,255,255,.15)';x.color='#fff';x.fontWeight=300}
              else{x.background=S.bg;x.backdropFilter=x.webkitBackdropFilter='none';x.border='none';x.color=light?'#000':'#fff';x.fontWeight=light?500:300}
            });
            const l=$('ls');l.style.width=S.lw+'px';l.style.height=S.lh+'px';l.style.background=S.lbgOn?hexa(S.lbg,S.lba/100):'transparent';paintImg('l');l.classList.toggle('ns',!S.sh);
            $('dc').style.fontSize=.875*S.dec+'px';
            paintTx();paint();paintIos();paintDk();render();placeTab();
            if($('pch'))syn();
            rep();
            const rv=resv(),sk=(S.str?1:0)+':'+S.sp+':'+rv[0]+'x'+rv[1];if(lastS!==sk){lastS=sk;nat({s:S.str?1:0,p:S.sp,w:rv[0],h:rv[1]})}
            if(lastG!==S.gray){lastG=S.gray;nat({g:S.gray?1:0})}
            const sv=spdv();if(lastV!==sv){lastV=sv;nat({v:sv})}
          }
          /* affiche / masque les blocs selon les réglages */
          function syn(){
            const m=S.mode,sh=(i,v)=>{const e=$(i);if(e)e.style.display=v?'':'none'};
            sh('pch',m==='chrono');sh('pls',m==='livesplit');sh('pdk',m==='dk');sh('sx',S.str);sh('rc',S.res==='custom');sh('pe',S.txOn);sh('bxo',S.tbg!=='none');sh('sko',+S.tsk>0);sh('tso',S.tan!=='none');sh('spc',S.spm==='custom');
            pop.querySelectorAll('.tg').forEach(b=>b.setAttribute('aria-pressed',S[b.dataset.k]?'true':'false'));
            const v=$('spv2');if(v)v.textContent=String(spdv()).replace('.',',')+'×';
            inf();
          }
          function setBg(u){if(u){BG=u;try{localStorage.setItem('bysgBg',u)}catch(e){}S[pickFor+'img']=1;S[BGON[pickFor]]=1;save()}else S[pickFor+'img']=0;apply();refImg()}
          const nat=m=>{try{webkit.messageHandlers.n.postMessage(m);return 1}catch(e){return 0}};
          let lastS='',lastG=-1,lastV=-1;
          /* choisir une photo : sélecteur natif iOS (le input file ne marche pas dans un overlay) */
          function pickImg(){if(!nat({pk:1})){const f=$('bgf');if(f)f.click()}}
          function openDc(){const u='https://discord.gg/fVyCHsutb';if(!nat({o:u}))window.open(u,'_blank')}
          function bindExtra(){
            const f=$('bgf');
            if(f)f.onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setBg(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(fl);e.target.value=''};
          }
          /* zones cliquables envoyées à l'app native : le reste de l'écran laisse passer les touches vers le jeu */
          let lastR='';
          function rep(){try{let a;if(pop.classList.contains('o'))a=[[0,0,innerWidth,innerHeight]];else{a=[];const m=S.mode,wr=w.getBoundingClientRect(),e=m==='chrono'?$('chrono'):m==='ios'?$('ios'):m==='dk'?$('dk'):m==='livesplit'?(S.lbgOn?$('ls'):$('dg')):null;
            if(dockOn()){const r=$('dkt').getBoundingClientRect();a.push([r.left-6,r.top-6,r.width+12,r.height+12])}else if(e){const r=e.getBoundingClientRect();a.push([r.left,r.top,r.width,r.height])}
            if(S.txOn){const q=$('tbx'),f=S.tan!=='none'?[30,22]:[0,0];
              if(S.glue)a.push([wr.left+q.offsetLeft*K-f[0],wr.top+q.offsetTop*K-f[1],q.offsetWidth*K+2*f[0],q.offsetHeight*K+2*f[1]]);
              else a.push([S.ox+q.offsetLeft-f[0],S.oy+q.offsetTop-f[1],q.offsetWidth+2*f[0],q.offsetHeight+2*f[1]])}}
            const j=JSON.stringify(a);if(j===lastR)return;lastR=j;webkit.messageHandlers.r.postMessage(a)}catch(e){}}
          addEventListener('resize',rep);
          function paintTx(){
            const tt=$('tt'),bx=$('tbx'),d=tt.style,f=S.tfx,c=S.tcol,kk=S.glue?K:1,sk=+S.tsk||0;
            tt.textContent=S.txt||' ';tt.classList.toggle('rb',f==='rainbow');
