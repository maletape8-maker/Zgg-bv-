            const set=()=>{S[k]=h2x(H,Sa,V);if(k==='icol'||k==='ibg'){S.ith=0;const q=pop.querySelector('.tg[data-k="ith"]');if(q)q.setAttribute('aria-pressed','false')}ui();go();save()};
            const mv=e=>{const r=sv.getBoundingClientRect();Sa=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));V=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));set()};
            sv.onpointerdown=e=>{sv.setPointerCapture(e.pointerId);sv.onpointermove=mv;mv(e)};
            sv.onpointerup=sv.onpointercancel=()=>sv.onpointermove=null;
            hu.oninput=()=>{H=+hu.value;set()};
            sw.onclick=()=>{if(performance.now()-popT>450)p.classList.toggle('o')};
            ui()})}
          /* déplacement (timer et texte détaché), clic, double clic, appui long */
          let iaT=null,drag=null,dragT='w',moved=false,lp=0,tap=0,sx=0,sy=0,seen=false;
          function down(e,k){
            if(e.button===2||pop.classList.contains('o'))return;seen=true;e.preventDefault();dragT=k;iaT=e.target.closest?e.target.closest('[data-ia]'):null;dT=performance.now();
            const n=k==='w'?w:$('tw'),r=n.getBoundingClientRect();
            drag={dx:e.clientX-r.left,dy:e.clientY-r.top};sx=e.clientX;sy=e.clientY;moved=false;n.classList.add('d');
            lp=setTimeout(()=>{if(!moved&&S.mode!=='ios'){drag=null;n.classList.remove('d');openPop()}},600);
          }
