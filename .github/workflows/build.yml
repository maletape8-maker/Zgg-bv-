          /* dégradé du texte (même formule HSV que l'original) */
          function hsv(h,s,v){const c=v*s,x=c*(1-Math.abs(h/60%2-1)),m=v-c,r=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return'rgb('+r.map(a=>Math.round(255*(a+m))).join()+')'}
          function grad(hx){const r=parseInt(hx.slice(1,3),16)/255,g=parseInt(hx.slice(3,5),16)/255,b=parseInt(hx.slice(5,7),16)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);let h=0;if(d){h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}const s=mx?d/mx:0;return'linear-gradient(180deg,'+hsv(h,.5*s,Math.min(1,1.5*mx+.1))+','+hsv(h,s,.8*mx)+')'}
          function render(){renderIos();renderDk();
            const t=Math.floor(el/1000),s=t%60,m=Math.floor(t/60)%60,h=Math.floor(t/3600);
            $('h').textContent=p2(h)+(S.lab?'h':'');$('m').textContent=p2(m)+(S.lab?'m':'');$('s').textContent=p2(s)+(S.lab?'s':'');
            $('dm').textContent=h?h+':'+p2(m)+':'+p2(s):m?m+':'+p2(s):String(s);
            $('dc').textContent=S.acc==='.234'?'.'+String(Math.floor(el)%1000).padStart(3,'0'):S.acc==='.23'?'.'+p2(Math.floor(el/10)%100):S.acc==='.2'?'.'+Math.floor(el/100)%10:'';
          }
          function paint(){
            const col=st==='running'?S.run:st==='paused'?S.pau:S.idle,d=$('dg').style;
